[package]
name = "redmine-cli"
version = "0.1.0"
edition = "2024"
description = "Rust Redmine CLI MVP"
license = "Apache-2.0"

[[bin]]
name = "redmine-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
redmine-api = "0.11.6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
